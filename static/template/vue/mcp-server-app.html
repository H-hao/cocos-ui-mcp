<div class="mcp-app">
    <!-- 选项卡导航 -->
    <div class="tab-navigation">
        <button class="tab-button" :class="{ active: activeTab === 'server' }" @click="switchTab('server')">
            <span>服务器</span>
        </button>
        <button class="tab-button" :class="{ active: activeTab === 'tools' }" @click="switchTab('tools')">
            <span>工具管理</span>
        </button>
    </div>
    
    <!-- 服务器选项卡 -->
    <div class="tab-content" v-show="activeTab === 'server'">
        <section class="server-status">
            <h3>服务器状态</h3>
            <div class="status-info">
                <div class="prop-list">
                    <div class="prop-row">
                        <label class="prop-label">状态</label>
                        <div class="prop-content">
                            <span class="status-value" :class="statusClass">{{ serverStatus }}</span>
                        </div>
                    </div>
                    <div class="prop-row" v-if="serverRunning">
                        <label class="prop-label">连接数</label>
                        <div class="prop-content">
                            <span>{{ connectedClients }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="server-controls">
            <div class="server-control-actions">
                <button type="button" class="panel-btn panel-btn--primary" @click="toggleServer" :disabled="isProcessing">
                    {{ serverRunning ? '停止服务器' : '启动服务器' }}
                </button>
                <button type="button" class="panel-btn panel-btn--secondary" @click="restartServerFromDist" :disabled="isProcessing">
                    从 dist 热重启
                </button>
            </div>
        </section>

        <section class="server-settings">
            <h3>服务器设置</h3>
            <div class="prop-list">
                <div class="prop-row">
                    <label class="prop-label" for="server-port">端口</label>
                    <div class="prop-content">
                        <input
                            id="server-port"
                            class="number-input"
                            type="number"
                            v-model.number="settings.port"
                            min="1024"
                            max="65535"
                            step="1"
                            :disabled="serverRunning"
                            @blur="normalizePortInput"
                        >
                    </div>
                </div>
                <div class="prop-row">
                    <label class="prop-label" for="server-auto-start">自动启动</label>
                    <div class="prop-content">
                        <input id="server-auto-start" class="checkbox-input" type="checkbox" v-model="settings.autoStart">
                    </div>
                </div>
                <div class="prop-row">
                    <label class="prop-label" for="server-debug-log">调试日志</label>
                    <div class="prop-content">
                        <input id="server-debug-log" class="checkbox-input" type="checkbox" v-model="settings.debugLog">
                    </div>
                </div>
                <div class="prop-row">
                    <label class="prop-label" for="server-max-connections">最大连接数</label>
                    <div class="prop-content">
                        <input
                            id="server-max-connections"
                            class="number-input"
                            type="number"
                            v-model.number="settings.maxConnections"
                            min="1"
                            max="100"
                            step="1"
                            @blur="normalizeMaxConnectionsInput"
                        >
                    </div>
                </div>
            </div>
        </section>

        <section class="server-info" v-if="serverRunning">
            <h3>连接信息</h3>
            <div class="connection-details">
                <div class="prop-list">
                    <div class="prop-row">
                        <label class="prop-label" for="http-url">HTTP URL</label>
                        <div class="prop-content">
                            <div class="input-action-row">
                                <input id="http-url" class="text-input" type="text" :value="httpUrl" readonly>
                                <button type="button" class="panel-btn panel-btn--secondary" :disabled="!httpUrl" @click="copyUrl">复制</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <button type="button" class="panel-btn panel-btn--primary" @click="saveSettings" :disabled="!settingsChanged || isProcessing">保存设置</button>
        </footer>
    </div>
    
    <!-- 工具管理选项卡 -->
    <div class="tab-content" v-show="activeTab === 'tools'">
        <section class="tool-manager">
            <div class="tool-manager-header">
                <h3>工具管理</h3>
            </div>
            
            <div class="tools-section">
                <div class="tools-section-header">
                    <div class="tools-section-title">
                        <h4>可用工具</h4>
                        <div class="tools-stats">
                            {{ totalTools }} 个工具
                            ({{ enabledTools }} 启用 / {{ disabledTools }} 禁用)
                        </div>
                    </div>
                    <div class="tools-section-controls">
                        <button type="button" class="tool-action-btn tool-action-btn--secondary" :disabled="isProcessing || totalTools === 0" @click="selectAllTools">全选</button>
                        <button type="button" class="tool-action-btn tool-action-btn--secondary" :disabled="isProcessing || totalTools === 0" @click="deselectAllTools">取消全选</button>
                        <button type="button" class="tool-action-btn tool-action-btn--primary" :disabled="isProcessing || totalTools === 0" @click="saveChanges">保存更改</button>
                    </div>
                </div>
                
                <div class="tools-container">
                    <div v-for="category in toolCategories" :key="category" class="tool-category">
                        <div class="category-header">
                            <h5>{{ getCategoryDisplayName(category) }}</h5>
                            <div class="category-controls">
                                <button type="button" class="tool-action-btn tool-action-btn--secondary" :disabled="isProcessing" @click="toggleCategoryTools(category, true)">全选</button>
                                <button type="button" class="tool-action-btn tool-action-btn--secondary" :disabled="isProcessing" @click="toggleCategoryTools(category, false)">取消全选</button>
                            </div>
                        </div>
                        <div class="tool-items">
                            <div v-for="tool in getToolsByCategory(category)" :key="tool.name" class="tool-item">
                                <input
                                    class="tool-item-checkbox"
                                    type="checkbox"
                                    :checked="tool.enabled"
                                    @change="(event) => onToolCheckboxChange(category, tool.name, event)"
                                >
                                <div class="tool-info">
                                    <div class="tool-name">{{ tool.name }}</div>
                                    <div class="tool-description">{{ tool.description }}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            

        </section>
    </div>
</div>
